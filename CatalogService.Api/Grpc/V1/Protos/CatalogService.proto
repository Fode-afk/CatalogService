syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package catalog.v1;

option csharp_namespace = "CatalogService.Api.Grpc.V1.Protos";

service CatalogService {
	rpc CreateProduct(CreateProductRequest) returns (ProductWriteAck);
    rpc UpdateProductInfo(UpdateProductInfoRequest) returns (ProductWriteAck);

    rpc SubmitProductForPublish(SubmitProductForPublishRequest) returns (ProductWriteAck);
    rpc WithdrawProductPublishSubmission(WithdrawProductPublishSubmissionRequest) returns (ProductWriteAck);
    rpc UnpublishProduct(UnpublishProductRequest) returns (ProductWriteAck);

    rpc ArchiveProduct(ArchiveProductRequest) returns (ProductWriteAck);
    rpc RestoreProduct(RestoreProductRequest) returns (ProductWriteAck);

    rpc DeleteProduct(DeleteProductRequest) returns (google.protobuf.Empty);

    rpc ReplaceProductAttributes(ReplaceProductAttributesRequest) returns (ProductWriteAck);
    rpc ReplaceProductTags(ReplaceProductTagsRequest) returns (ProductWriteAck);
}

message CreateProductRequest {
    string vendor_id = 1;
    string category_id = 2;
    string brand_id = 3;
    string name = 4; 
    string slug = 5;
    string description = 6;
    string short_description = 7;
    string seo_title = 8;
    string seo_description = 9;
    string seo_keywords = 10;
}

message UpdateProductInfoRequest {
    string product_id = 1;
    string vendor_id = 2;
    string name = 3;
    string slug = 4;
    string description = 5;
    string short_description = 6;
    string category_id = 7;
    string brand_id = 8;
    string seo_title = 9;
    string seo_description = 10;
    string seo_keywords = 11;
}

message SubmitProductForPublishRequest {
    string product_id = 1;
    string vendor_id = 2;
}

message WithdrawProductPublishSubmissionRequest {
    string product_id = 1;
    string vendor_id = 2;
}

message UnpublishProductRequest {
    string product_id = 1;
    string vendor_id = 2;
}

message ArchiveProductRequest {
    string product_id = 1;
    string vendor_id = 2;
}

message RestoreProductRequest {
    string product_id = 1;
    string vendor_id = 2;
}

message DeleteProductRequest {
    string product_id = 1;
    string vendor_id = 2;
}

message ReplaceProductAttributesRequest {
    string vendor_id = 1;
    string product_id = 2;
    map<string, string> attributes = 3;
}

message ReplaceProductTagsRequest {
    string vendor_id = 1;
    string product_id = 2;
    repeated string tags = 3;
}

message ProductWriteAck {
    string product_id = 1;
    int64 version = 2;
}