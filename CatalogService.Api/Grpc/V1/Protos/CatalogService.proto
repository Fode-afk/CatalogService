syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package catalog.v1;

option csharp_namespace = "CatalogService.Api.Grpc.V1.Protos";

service CatalogService {
	rpc CreateProduct(CreateProductRequest) returns (google.protobuf.Empty);
    rpc UpdateProductInfo(UpdateProductInfoRequest) returns (google.protobuf.Empty);

    rpc PublishProduct(PublishProductRequest) returns (google.protobuf.Empty);
    rpc ArchiveProduct(ArchiveProductRequest) returns (google.protobuf.Empty);

    rpc ReplaceProductAttributes(ReplaceProductAttributesRequest) returns (google.protobuf.Empty);
    rpc ReplaceProductTags(ReplaceProductTagsRequest) returns (google.protobuf.Empty);

    rpc GetProductById(GetProductByIdRequest) returns (GetProductByIdResponse);
}

message ProductDto {
    string id = 1;
    string name = 2;
    string slug = 3;
    string description = 4;
    string short_description = 5;
    double rating_avg = 6;
    int32 rating_count = 7;
    string default_product_id = 8;
    int32 product_count = 9;
    int64 price_minor_amount = 10;
    int64 old_price_minor_amount = 11;
    StockStatus stock_status = 12;
    string category_id = 13;
    string category_name = 15;
    string category_slug = 16;
    string vendor_id = 17;
    string brand = 18;
    ProductCardStatus product_card_status = 19;
    SeoMetadataDto seo_metadata = 20;
    map<string, string> attributes = 21;
    repeated string tags = 22;
    repeated ProductCardImageDto images = 23;
}

message SeoMetadataDto {
    string title = 1;
    string description = 2;
    string keywords = 3;
}

message ProductCardImageDto {
    string url = 1;
    string alt = 2;
    bool is_main = 3;
    int32 sort_order = 4;
}

enum StockStatus {
    IN_STOCK = 0;
    OUT_OF_STOCK = 1;
    PREORDER = 2;
    BLOCKED = 3;
}

enum ProductCardStatus {
    DRAFT = 0;
    PUBLISHED = 1;
    ARCHIVED = 2;
}

message CreateProductRequest {
    string vendor_id = 1;
    string category_id = 2;
    string brand_id = 3;
    string name = 4; 
    string slug = 5;
    string description = 6;
    string short_description = 7;
    string seo_title = 8;
    string seo_description = 9;
    string seo_keywords = 10;
}

message UpdateProductInfoRequest {
    string product_id = 1;
    string vendor_id = 2;
    string name = 3;
    string slug = 4;
    string description = 5;
    string short_description = 6;
    string category_id = 7;
    string brand_id = 8;
    string seo_title = 9;
    string seo_description = 10;
    string seo_keywords = 11;
}

message PublishProductRequest {
    string product_id = 1;
    string vendor_id = 2;
}

message ArchiveProductRequest {
    string product_id = 1;
    string vendor_id = 2;
}

message ReplaceProductAttributesRequest {
    string vendor_id = 1;
    string product_id = 2;
    map<string, string> attributes = 3;
}

message ReplaceProductTagsRequest {
    string vendor_id = 1;
    string product_id = 2;
    repeated string tags = 3;
}

message GetProductByIdRequest {
    string product_id = 1;
    string currncy_code = 2;
}

message GetProductByIdResponse {
    ProductDto product = 1;
}